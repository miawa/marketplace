<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Sign Up | Minted</title>

      <!-- CSS Includes -->
      <link rel="stylesheet" href="css/signup.css" />
      
  </head>
  <body>

    <!-- Main Signup Box -->
    <div class="signupBox">
        
        <div class="title">
            <img class="site-logo" src="images/logo-notext.png" alt="Minted Site Logo" class="top-logo" />
            <img class="site-logo-text" src="images/logo-text-only.png" alt="Minted Site Logo" class="top-logo" />
        </div>

        <div id="msg" class="msg"></div>

        <!-- Signup Step 1 -->
        <div class="step active" id="step1">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="e.g. mike_student" autocomplete="username">
                <div class="hint">Letters, numbers, and underscores only.</div>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="registeredEmail" placeholder="student@university.ac.uk">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="registeredPassword" placeholder="••••••••" autocomplete="new-password">
            </div>
            <div class="input-group">
                <label>Retype Password</label>
                <input type="password" id="registeredPasswordConfirm" placeholder="••••••••" autocomplete="new-password">
            </div>

            <button class="btn-action" onclick="goToStep2()">Next</button>

            <p class="footer-text">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
        <!-- End Signup Step 1 -->

        <!-- Signup Step 2 -->
        <div class="step" id="step2">
            <div class="avatar-container">
                <div class="default-avatar" id="avatarPreview">
                    <img id="avatarImg"
                        src="https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg"
                        alt="Avatar">
                </div>
                <label class="editProfilePicBtn">
                    Edit profile picture
                    <input type="file" id="picUpload" hidden accept="image/*">
                </label>
            </div>
            

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label>Bio</label>
                <textarea id="bio" placeholder="Tell us a bit about yourself…"></textarea>
            </div>

            <button class="btn-action" id="finishBtn" onclick="finishSignup()">
                Finish &amp; Go to Marketplace
            </button>
        </div>
        <!-- End Signup Step 2 -->

        <!-- Signup Step 3 -->
        <div class="step" id="step3">
          <h2 style="font-size:18px; font-weight:700; color:#111; margin-bottom:8px;">Before you start...</h2>
          <p style="font-size:14px; color:#6b7280; margin-bottom:20px;">What are you most interested in? Pick as many as you like.</p>
          <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px;">
            <button class="onboard-btn" data-category="Clothing">Clothing</button>
            <button class="onboard-btn" data-category="Electronics">Electronics</button>
            <button class="onboard-btn" data-category="Furniture">Furniture</button>
            <button class="onboard-btn" data-category="Textbooks">Textbooks</button>
            <button class="onboard-btn" data-category="Other">Other</button>
          </div>
          <div style="display:flex; gap:10px;">
            <button onclick="skipInterests()" style="flex:1; padding:12px; border:1px solid #e5e7eb; background:#fff; border-radius:8px; font-size:15px; cursor:pointer; color:#6b7280;">Skip</button>
            <button onclick="submitInterests()" style="flex:2; padding:12px; background:#7032a0; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">Let's go</button>
          </div>
        </div>
        <!-- End Signup Step 3 -->
    </div>

    <!-- Javascript Includes -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/global.js"></script>
    <script src="js/signup.js"></script>
    <!-- End Javascript Includes -->
  </body>
</html>
