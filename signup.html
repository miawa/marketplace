<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Minted</title>
    <link rel="stylesheet" href="css/signup.css" />
    
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<div class="signupBox">
    
    <div class="title">
        <img class="site-logo" src="images/logo-notext.png" alt="Minted Site Logo" class="top-logo" />
        <img class="site-logo-text" src="images/logo-text-only.png" alt="Minted Site Logo" class="top-logo" />
    </div>

    <div id="msg" class="msg"></div>
    <div class="step" id="step1">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="e.g. mike_student" autocomplete="username">
            <div class="hint">Letters, numbers, and underscores only.</div>
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="registeredEmail" placeholder="student@university.ac.uk">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="registeredPassword" placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="input-group">
            <label>Retype Password</label>
            <input type="password" id="registeredPasswordConfirm" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button class="btn-action" onclick="goToStep2()">Next</button>

        <p class="footer-text">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </div>
    <div class="step" id="step2">
        <div class="avatar-container">
            <div class="default-avatar" id="avatarPreview">
                <img id="avatarImg"
                     src="https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg"
                     alt="Avatar">
            </div>
            <label class="editProfilePicBtn">
                Edit profile picture
                <input type="file" id="picUpload" hidden accept="image/*">
            </label>
        </div>
        

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
        </div>

        <div class="input-group">
            <label>Bio</label>
            <textarea id="bio" placeholder="Tell us a bit about yourself…"></textarea>
        </div>

        <button class="btn-action" id="finishBtn" onclick="finishSignup()">
            Finish &amp; Go to Marketplace
        </button>
    </div>

    <div class="step active" id="step3">
      <h2 style="font-size:18px; font-weight:700; color:#111; margin-bottom:8px;">Before you start...</h2>
      <p style="font-size:14px; color:#6b7280; margin-bottom:20px;">What are you most interested in? Pick as many as you like.</p>
      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px;">
        <button class="onboard-btn" data-category="Clothing">Clothing</button>
        <button class="onboard-btn" data-category="Electronics">Electronics</button>
        <button class="onboard-btn" data-category="Furniture">Furniture</button>
        <button class="onboard-btn" data-category="Textbooks">Textbooks</button>
        <button class="onboard-btn" data-category="Other">Other</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button onclick="skipInterests()" style="flex:1; padding:12px; border:1px solid #e5e7eb; background:#fff; border-radius:8px; font-size:15px; cursor:pointer; color:#6b7280;">Skip</button>
        <button onclick="submitInterests()" style="flex:2; padding:12px; background:#7032a0; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">Let's go</button>
      </div>
    </div>
</div>

<script>
  const msgEl = document.getElementById("msg");

  function showMsg(text, type = "error") {
    msgEl.textContent = text;
    msgEl.className   = "msg " + type;
  }

  //registering user 
  
  function goToStep2() {

    const username = document.getElementById("username").value.trim();
    const email    = document.getElementById("registeredEmail").value.trim();

    const pass     = document.getElementById("registeredPassword").value;
    const confirm  = document.getElementById("registeredPasswordConfirm").value;

    //basic validation - could definitely add more fields although supabase does its own validation too, so can 
    //get tricky with compatability
        if (!username || !email || !pass) {
            return showMsg("Please fill in all fields.");
        }
        if (!/^[a-z0-9_]+$/i.test(username)) {
        return showMsg("Username can only contain letters, numbers, and underscores.");
        }
        if (pass.length < 6) {
        return showMsg("Password must be at least 6 characters.");
        }
        if (pass !== confirm) {
        return showMsg("Passwords do not match.");
        }

    msgEl.className = "msg"; 
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    document.getElementById("step2").classList.add("active");

//sets default avatar before uploading own, can keep basic     
    document.getElementById("avatarImg").src =
      `https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg`;
  }

  
  let avatarBase64 = null;
//handles profile picture converts to uploadable format, previews image on page
  document.getElementById("picUpload").addEventListener("change", function (e) {

    const file   = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function () {
      avatarBase64 = reader.result;
        document.getElementById("avatarImg").src = reader.result;
    };
    reader.readAsDataURL(file);

   
});
 document.querySelectorAll('.onboard-btn').forEach(btn => {
  btn.addEventListener('click', () => btn.classList.toggle('selected'));
 });

  async function finishSignup() {
    const btn = document.getElementById("finishBtn");
    btn.disabled    = true;
    btn.textContent = "Creating account…";

    //gets all info from forms and uploads to database 
    //possibly adding location? if implementing nearby pickups
    try {
      await signUp({
        username:     document.getElementById("username").value.trim().toLowerCase(),
        email:        document.getElementById("registeredEmail").value.trim(),

        password:     document.getElementById("registeredPassword").value,
        fullName:     document.getElementById("fullName").value.trim(),
        bio:          document.getElementById("bio").value.trim(),
        avatarBase64: avatarBase64
      });

      showMsg(
        "Account created! Check your email to confirm, then log in.",
        "success"
      );

      showMsg("Account created! Choose your interests below.", "success");
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    document.getElementById("step3").classList.add("active");

    } catch (err) {
      showMsg(err.message);
      btn.disabled    = false;
      btn.textContent = "Finish & Go to Marketplace";
    }
  }

   async function submitInterests() {
    const selected = [...document.querySelectorAll('.onboard-btn.selected')].map(b => b.dataset.category);
    if (selected.length > 0) {
        const { data: { user } } = await window.supabase.auth.getUser();
        if (user) {
        for (const category of selected) {
            await window.supabase
            .from('user_category_likes')
            .upsert(
            { user_id: user.id, category: category, like_count: 3 },
            { onConflict: 'user_id,category', ignoreDuplicates: false }
          );
      }
    }
  }
  window.location.href = "login.html";
}

function skipInterests() {
  window.location.href = "login.html";
}
</script>
