<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | Marketplace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/profile-style.css">
</head>
<body>

  <div class="profileContainer">
    <header class="search-header">
      <input type="text" id="searchInput" placeholder="Search items from this user...">
    </header>

    <div class="main-layout">
      <aside class="sidebar">
        <ul>
          <li class="profile-link" onclick="window.location.href='profile.html'">
            <img src="https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg" alt="Profile" class="sidebar-avatar">
            My Profile
          </li>
          <hr>
          <li onclick="window.location.href='index.html'">All Items</li>
          <li>Clothing</li>
          <li>Electronics</li>
          <li>Furniture</li>
          <li>Textbooks</li>
        </ul>
      </aside>

      <div class="profileContent">
        <header class="profile-header">
          <div class="user-info">
            <div class="avatar">
              <img id="userAvatar" src="https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg" alt="User Avatar">
            </div>
            <div class="user-details">
              <h1 id="userName">Loading...</h1>
              <div class="ratings">
                <span class="stars">★★★★★</span>
                <span class="rating-count">(42)</span>
              </div>
              <div class="stats">
                <span><strong>12</strong> followers</span>
                <span><strong>8</strong> following</span>
              </div>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn-secondary" id="editProfileBtn">Edit Profile</button>
            <button class="btn-secondary">Follow</button>
            <button class="btn-secondary">Share</button>
          </div>
        </header>

        <nav class="profile-tabs">
          <a href="#" class="active">Items</a>
          <a href="#" id="reviewsTab">Reviews</a>
          <a href="#">About</a>
        </nav>

        <main class="items-grid" id="userCloset"></main>
      </div>
    </div>
    <div id="reviewsModal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Reviews</h2>
          <button id="closeReviewsBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        <div id="reviewsList" class="reviews-list">
        </div>
      </div>
    </div>

    <div id="editProfileModal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Edit Profile</h2>
          <button id="closeEditBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        <form id="editProfileForm">
          <div class="input-group" style="margin-bottom: 20px;">
            <label for="avatarInput" style="display: block; margin-bottom: 10px; font-weight: 600;">Profile Picture</label>
            <div style="display: flex; align-items: center; gap: 15px;">
              <img id="editAvatarPreview" src="https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg" alt="Avatar Preview" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
              <input type="file" id="avatarInput" accept="image/*" style="padding: 8px; border: 1px solid #ddd; border-radius: 6px;">
            </div>
          </div>

          <div class="input-group" style="margin-bottom: 20px;">
            <label for="editFullName" style="display: block; margin-bottom: 5px; font-weight: 600;">Full Name</label>
            <input type="text" id="editFullName" placeholder="Enter your full name" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
          </div>

          <div class="input-group" style="margin-bottom: 20px;">
            <label for="editBio" style="display: block; margin-bottom: 5px; font-weight: 600;">Bio</label>
            <textarea id="editBio" placeholder="Tell us about yourself..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box; resize: vertical; min-height: 80px;"></textarea>
          </div>

          <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn-secondary" style="flex: 1; background-color: #00767d; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Save Changes</button>
            <button type="button" id="cancelEditBtn" style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 600;">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <style>
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background: white;
        border-radius: 12px;
        padding: 20px;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }

      .productCard {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;

      }

      .reviews-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .reviewBox {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        background: #f9f9f9;
      }

      .review-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .reviewer-name {
        font-weight: 600;
        color: #333;
      }

      .review-rating {
        color: #ff9800;
        font-size: 1.1rem;
      }

      .review-comment {
        color: #666;
        margin-top: 10px;
        line-height: 1.5;
      }

      .review-date {
        color: #999;
        font-size: 0.85rem;
        margin-top: 8px;
      }
    </style>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    let userData = null;
    let userItems = [];

    async function loadUserProfile() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const userQuery = urlParams.get('user');
        const { data: { user: authUser } } = await window.supabase.auth.getUser();

        let targetUser;
        let isOwnProfile = false;

        if (userQuery) {
          // Viewing another user's profile
          let { data, error } = await window.supabase
            .from('users')
            .select('*')
            .eq('username', userQuery)
            .single();

          if (error || !data) {
            const { data: dataById, error: errorById } = await window.supabase
              .from('users')
              .select('*')
              .eq('id', userQuery)
              .single();

            if (errorById || !dataById) {
              document.getElementById('userName').textContent = 'User not found';
              return;
            }
            targetUser = dataById;
          } else {
            targetUser = data;
          }

          // Check if this is actually the current user's profile
          if (authUser && targetUser.id === authUser.id) {
            isOwnProfile = true;
          }
        } else {
          // Viewing own profile
          if (!authUser) {
            window.location.href = 'login.html';
            return;
          }

          const { data, error } = await window.supabase
            .from('users')
            .select('*')
            .eq('id', authUser.id)
            .single();

          if (error || !data) {
            document.getElementById('userName').textContent = 'Profile not found';
            console.error('Error fetching user profile:', error);
            return;
          }
          targetUser = data;
          isOwnProfile = true;
        }

        userData = targetUser;

        // Fetch user's items
        const { data: items, error: itemsError } = await window.supabase
          .from('items')
          .select('*, item_images(image_url)')
          .eq('seller_id', targetUser.id);

        if (!itemsError) {
          userItems = items || [];
        }

        // Fetch follower/following counts
        const { count: followerCount, error: followerError } = await window.supabase
          .from('follows')
          .select('*', { count: 'exact', head: true })
          .eq('following_id', targetUser.id);

        const { count: followingCount, error: followingError } = await window.supabase
          .from('follows')
          .select('*', { count: 'exact', head: true })
          .eq('follower_id', targetUser.id);

        // Fetch reviews for this user
        const { data: reviews, error: reviewsError } = await window.supabase
          .from('reviews')
          .select('rating')
          .eq('reviewee_id', targetUser.id);

        // Calculate average rating
        let avgRating = 0;
        let reviewCount = 0;
        if (!reviewsError && reviews && reviews.length > 0) {
          const totalRating = reviews.reduce((sum, review) => sum + (review.rating || 0), 0);
          avgRating = Math.round((totalRating / reviews.length) * 10) / 10;
          reviewCount = reviews.length;
        }

        // Generate stars based on rating
        const fullStars = Math.floor(avgRating);
        const hasHalfStar = avgRating % 1 >= 0.5;
        let starsHtml = '';
        for (let i = 0; i < 5; i++) {
          if (i < fullStars) {
            starsHtml += '★';
          } else if (i === fullStars && hasHalfStar) {
            starsHtml += '★';
          } else {
            starsHtml += '☆';
          }
        }

        // Populate user info
        document.getElementById('userName').textContent = targetUser.username || 'Unknown User';
        document.getElementById('userAvatar').src = targetUser.avatar_url || 'https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg';

        // Update ratings and stats
        document.querySelector('.stars').textContent = starsHtml;
        document.querySelector('.rating-count').textContent = `(${reviewCount})`;
        document.querySelectorAll('.stats span')[0].innerHTML = `<strong>${followerCount || 0}</strong> followers`;
        document.querySelectorAll('.stats span')[1].innerHTML = `<strong>${followingCount || 0}</strong> following`;

        // Update sidebar
        document.querySelector('.sidebar-avatar').src = targetUser.avatar_url || 'https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg';

        // Show/hide Edit Profile button based on whether it's own profile
        const editBtn = document.getElementById('editProfileBtn');
        if (isOwnProfile) {
          editBtn.style.display = 'inline-block';
        } else {
          editBtn.style.display = 'none';
        }

        // Render items
        renderProfile();

      } catch (err) {
        console.error('Error loading profile:', err);
        document.getElementById('userName').textContent = 'Error loading profile';
      }
    }
      
    

    //puts all users items onto a grid on profile

    function renderProfile() {
      const grid = document.getElementById('userCloset');
      const search = document.getElementById('searchInput').value.toLowerCase();
       grid.innerHTML = '';

  const active = userItems.filter(i => !i.is_sold && i.title.toLowerCase().includes(search));
  const sold   = userItems.filter(i =>  i.is_sold && i.title.toLowerCase().includes(search));

  function makeProductBox(item) {
    const productBox = document.createElement('div');
    productBox.className = 'itemBox';
    productBox.onclick = () => window.location.href = `product.html?id=${item.id}`;
    const imageUrl = item.item_images?.[0]?.image_url || `data:image/svg+xml;base64,...`;
    productBox.innerHTML = `
      <div class="image-wrapper" style="position:relative;">
        <img src="${imageUrl}" alt="${item.title}" onerror="this.src='data:image/svg+xml;base64,...'">
        ${item.is_sold ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;border-radius:8px;"><span style="color:#fff;font-size:18px;font-weight:800;letter-spacing:1px;">SOLD</span></div>` : ''}
      </div>
      <div class="item-info">
        <div class="item-price">£${item.price}</div>
        <div class="item-size">${item.size}</div>
        <div class="item-brand">${item.brand}</div>
      </div>`;
    return productBox;
  }

  if (active.length === 0 && sold.length === 0) {
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:50px;">No items found.</p>`;
    return;
  }

  active.forEach(item => grid.appendChild(makeProductBox(item)));

  if (sold.length > 0) {
    const divider = document.createElement('div');
    divider.style = 'grid-column:1/-1;margin:24px 0 8px;font-weight:700;font-size:15px;color:#6b7280;border-top:1px solid #e5e7eb;padding-top:16px;';
    divider.textContent = 'Sold';
    grid.appendChild(divider);
    sold.forEach(item => grid.appendChild(makeProductBox(item)));
  }

      const filteredItems = userItems.filter(item =>
        item.title.toLowerCase().includes(search)
      );
        // loading items for user profile, if no items found show message, otherwise show items in a grid with their information and image, clicking on item takes you to product page for that item
      if (filteredItems.length > 0) {
        filteredItems.forEach((item) => {
          const productBox = document.createElement("div");
          productBox.className = "itemBox";
          productBox.onclick = () => window.location.href = `product.html?id=${item.id}`;
          const imageUrl = item.item_images && item.item_images.length > 0
            ? item.item_images[0].image_url
            : `data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjNmNGY2Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5YTNhZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg==`;
          productBox.innerHTML = `
            <div class="image-wrapper"><img src="${imageUrl}" alt="${item.title}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjNmNGY2Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5YTNhZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='"></div>
            <div class="item-info">
              <div class="item-price">£${item.price}</div>
              <div class="item-size">${item.size}</div>
              <div class="item-brand">${item.brand}</div>
            </div>`;
          grid.appendChild(productBox);
        });
      } else {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 50px;">No items found.</p>`;
      }
    }

    //modal clicking and handling

    document.getElementById('searchInput').addEventListener('input', renderProfile);
    loadUserProfile();

    document.getElementById('reviewsTab').addEventListener('click', async (e) => {
      e.preventDefault();
      await loadReviews();
    });

    
    document.getElementById('closeReviewsBtn').addEventListener('click', () => {
      document.getElementById('reviewsModal').style.display = 'none';
    });

   
    document.getElementById('reviewsModal').addEventListener('click', (e) => {
      if (e.target.id === 'reviewsModal') {
        document.getElementById('reviewsModal').style.display = 'none';
      }
    });

    //modal clicking end--------------

    async function loadReviews() {
      try {
        const { data: { user: authUser } } = await window.supabase.auth.getUser();
        if (!authUser) return;

        // fetch reviews for the current user with supabase 
        const { data: reviews, error } = await window.supabase
          .from('reviews')
          .select('id, rating, comment, created_at, reviewer_id')
          .eq('reviewee_id', userData.id)
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Error fetching reviews:', error);
          return;
        }

        // fetching reviewer information from supabase
        const reviewsWithReviewers = await Promise.all(
          (reviews || []).map(async (review) => {
            if (review.reviewer_id) {
              const { data: reviewer } = await window.supabase
                .from('users')
                .select('username, avatar_url')
                .eq('id', review.reviewer_id)
                .single();
              return { ...review, reviewer };
            }
            return { ...review, reviewer: null };
          })
        );

        const reviewsList = document.getElementById('reviewsList');
        reviewsList.innerHTML = '';

        if (!reviewsWithReviewers || reviewsWithReviewers.length === 0) {
          reviewsList.innerHTML = '<p style="text-align: center; color: #999;">No reviews yet</p>';
          document.getElementById('reviewsModal').style.display = 'flex';
          return;
        }
        //basic fallback for review information. best if user is deleted or cannot be loaded
        //preferably always 'load' user information with a default avatar and username for fallback
        reviewsWithReviewers.forEach((review) => {
          const reviewer = review.reviewer;
          const reviewerName = reviewer?.username || 'Anonymous';
          const reviewerAvatar = reviewer?.avatar_url || 'https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg';

          // stars for their review based on their rating
          let starsHtml = '';
          for (let i = 0; i < 5; i++) {
            starsHtml += i < review.rating ? '★' : '☆';
          }

          const reviewDate = new Date(review.created_at).toLocaleDateString();
        //creating look for the reviews portion with review information, image of review etc
          const reviewBox = document.createElement('div');
          reviewBox.className = 'reviewBox';
          reviewBox.innerHTML = `
            <div class="review-header">
              <div style="display: flex; align-items: center; gap: 10px;">
                <img src="${reviewerAvatar}" alt="${reviewerName}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                <span class="reviewer-name">${reviewerName}</span>
              </div>
              <span class="review-rating">${starsHtml}</span>
            </div>
            <p class="review-comment">${review.comment || 'No comment'}</p>
            <div class="review-date">${reviewDate}</div>
          `;
          reviewsList.appendChild(reviewBox);
        });

        document.getElementById('reviewsModal').style.display = 'flex';

      } catch (err) {
        console.error('Error loading reviews:', err);
      }
    }

    // edit profile button
    document.getElementById('editProfileBtn').addEventListener('click', async () => {
      const { data: { user: authUser } } = await window.supabase.auth.getUser();
      if (!authUser || !userData) return;

      //fills form with current correct user data
      document.getElementById('editFullName').value = userData.full_name || '';
        document.getElementById('editBio').value = userData.bio || '';
       document.getElementById('editAvatarPreview').src = userData.avatar_url || 'https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg';

      document.getElementById('editProfileModal').style.display = 'flex';
    });

    
    document.getElementById('closeEditBtn').addEventListener('click', () => {
      document.getElementById('editProfileModal').style.display = 'none';
    });

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      document.getElementById('editProfileModal').style.display = 'none';
    });

    //preview profile picture
    document.getElementById('avatarInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('editAvatarPreview').src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    //basic, closes modal when clicking off
    document.getElementById('editProfileModal').addEventListener('click', (e) => {
      if (e.target.id === 'editProfileModal') {
        document.getElementById('editProfileModal').style.display = 'none';
      }
    });

   //allowing user to change profile information, reloads state and updates web
    document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      try {
        const { data: { user: authUser } } = await window.supabase.auth.getUser();
        if (!authUser) return;

        let avatarUrl = userData.avatar_url;

        
        const avatarInput = document.getElementById('avatarInput');
        if (avatarInput.files.length > 0) {
          const file = avatarInput.files[0];
          const filePath = `${authUser.id}/avatar_${Date.now()}.jpg`;

          const { error: uploadError } = await window.supabase.storage
            .from('profilePictures')
            .upload(filePath, file, { contentType: file.type, upsert: false });

          if (uploadError) throw uploadError;

          const { data: urlData } = window.supabase.storage
            .from('profilePictures')
            .getPublicUrl(filePath);
          avatarUrl = urlData.publicUrl;
        }

        const { error } = await window.supabase
          .from('users')
          .update({
            full_name: document.getElementById('editFullName').value,
            bio: document.getElementById('editBio').value,
            avatar_url: avatarUrl
          })
          .eq('id', authUser.id);

        if (error) throw error;

        
        document.getElementById('editProfileModal').style.display = 'none';
        await loadUserProfile();
        alert('Profile updated successfully!');

      } catch (err) {
        console.error('Error updating profile:', err);
        alert('Error updating profile: ' + err.message);
      }
    })
  </script>
</body>
</html>
