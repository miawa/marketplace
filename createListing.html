<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Listing - Student Marketplace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/create-listing.css">
</head>
<body>
  <div class="layout">
    <main class="main-content">
      <div class="content-wrapper">
        <div class="create-listing-container">
          <a href="index.html" class="goBack">← Back to Marketplace</a>
          <h1>Create New Listing</h1>

          <form id="createListingForm">
            <div class="inputGroup">
              <label for="title">Title *</label>
              <input type="text" id="title" required placeholder="e.g. Computer Science Textbook">
            </div>

            <div class="inputGroup">
              <label for="description">Description</label>
              <textarea id="description" placeholder="Describe your item..."></textarea>
            </div>

            <div class="inputGroup">
              <label for="price">Price (£) *</label>
              <input type="number" id="price" required step="0.01" min="0.01" placeholder="0.00">
            </div>

            <div class="inputGroup">
              <label for="brand">Brand</label>
              <input type="text" id="brand" placeholder="e.g. Apple" value="No Brand">
            </div>

            <div class="inputGroup">
              <label for="size">Size</label>
              <input type="text" id="size" placeholder="e.g. M, 8, One Size" value="One Size">
            </div>

            <div class="inputGroup">
              <label for="condition">Condition *</label>
              <select id="condition" required>
                <option value="">Select condition</option>
                <option value="New with tags">New with tags</option>
                <option value="New without tags">New without tags</option>
                <option value="Like New">Like new</option>
                <option value="Very Good">Very good</option>
                <option value="Good">Good</option>
                <option value="Used">Used</option>
                <option value="Poor">Poor</option>
              </select>
            </div>

            <div class="inputGroup">
              <label for="category">Category *</label>
              <select id="category" required>
                <option value="">Select category</option>
                <option value="Clothing">Clothing</option>
                <option value="Electronics">Electronics</option>
                <option value="Textbooks">Textbooks</option>
                <option value="Furniture">Furniture</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="imageUploadSection
            ">
              <label>Images *</label>
              <div class="imageUploadBox" id="imageUploadBox">
                <div>
                  <div style="font-size: 24px; margin-bottom: 10px;">Images</div>
                  <div>Click to upload images or drag and drop</div>
                  <div style="font-size: 12px; color: #6b7280; margin-top: 5px;">Multiple images allowed</div>
                </div>
                <input type="file" id="imageInput" multiple accept="image/*" style="display: none;">
              </div>
              <div class="imagePreview" id="imagePreview"></div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Create Listing</button>
          </form>

          <div id="msg" class="msg" style="display: none;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('createListingForm');
    const submitBtn = document.getElementById('submitBtn');
    const msgEl = document.getElementById('msg');
    const imageInput = document.getElementById('imageInput');
    const imageUploadBox = document.getElementById('imageUploadBox');
    const imagePreview = document.getElementById('imagePreview');
    const urlParams = new URLSearchParams(window.location.search);
    const editItemId = urlParams.get('edit');
    const isEditMode = Boolean(editItemId);
    let editItem = null;

    window.removeImage = removeImage;


    //let uploadedImageUrls = [];
    let selectedImages = [];

    // basic listener to see if images being added to image upload area
    imageUploadBox.addEventListener('click', () => {
      imageInput.click();
    });
//allows drag and drop logic
    imageInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      await handleImageFiles(files);
    });
    imageUploadBox.addEventListener('dragover', (e) => {
      e.preventDefault();
      imageUploadBox.classList.add('dragover');});

    imageUploadBox.addEventListener('dragleave', () => {imageUploadBox.classList.remove('dragover');});

      imageUploadBox.addEventListener('drop', async (e) => {

        e.preventDefault();
        imageUploadBox.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files);
        await handleImageFiles(files); });

    //on event e when user selects the image it takes the files and puts them into an array, then passes to next function to check they're actually images
    async function handleImageSelect(e) {
      const files = Array.from(e.target.files);
      await handleImageFiles(files);
    }

    //error checking by checking if the file being uploaded is an image and is being stored correctly with the image/ check

    //so if they upload anything thats not an image it just ignores it and will only add images (if any) to the files array
    async function handleImageFiles(files) {
      const imageFiles = files.filter(file => file.type.startsWith('image/'));
      const resizedFiles = await Promise.all(imageFiles.map(file => resizeImageFile(file)));
      selectedImages = selectedImages.concat(resizedFiles);
      updateImagePreview();
    }

    async function resizeImageFile(file) {
      const maxDimension = 1200;
      const quality = 0.7;

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let { width, height } = img;
            const ratio = Math.min(maxDimension / width, maxDimension / height, 1);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error('Image resize failed')); return;
              }
              const fileName = file.name.replace(/\.[^.]+$/, '.jpg');
              const resizedFile = new File([blob], fileName, { type: 'image/jpeg', lastModified: Date.now() });
              resolve(resizedFile);
            }, 'image/jpeg', quality);
          };
          img.onerror = () => reject(new Error('Invalid image file'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('Failed to read image'));
        reader.readAsDataURL(file);
      });
    }

    //CODE IDEA? 
    //Have it so you can change the order of images that will appear on the listing by dragging the image previews or selecting numbered order maybe?

    function updateImagePreview() {
      imagePreview.innerHTML = '';
      selectedImages.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = (e) => {

          const previewItem = document.createElement('div');


          previewItem.className = 'imagePreviewItem';
          previewItem.innerHTML = `<img src="${e.target.result}" alt="Preview ${index + 1}"><button type="button" class="removeImage" onclick="removeImage(${index})">&times;</button>`;
          imagePreview.appendChild(previewItem);
        };
        reader.readAsDataURL(file);
      });
    }
    
    //when pressing the x button on a preview of the image, it will remove it by finding the image at the first index of the array and removing it with splice
    //each image should be stored in the array so 'first image of the array' basically is just the image thats being clicked on
    function removeImage(index) {
      selectedImages.splice(index, 1);

      updateImagePreview();
    }

    

    //all logic for inserting listing into database, checking listing data is valid and checking user uploading is valid 


    // waiting for the form button to be submitted before authenticating listing
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      msgEl.style.display = 'none';

      try {
        //checks that a user is logged in and that user is an authenticated user 
        const session = await requireAuth();
        const user = session?.user;
        
        //debug just for checking user/item data for now
        console.log('Session:', session);
        console.log('User object:', user);
        console.log('User ID:', user?.id);
        console.log('User email:', user?.email);
        
        //if the user logged in has no user id (authenticated id) it's redirected to the login page with error
          if (!user || !user.id) {
            showMsg('You must be logged in to upload an item or create a listing. Redirecting to login...', 'error');
            setTimeout(() => window.location.href = 'login.html', 2000);
            return;
        }

        // gets all the data that the user put into the form and trims any blanks from start/end to be compatable with database
        //if user didn't put information in for the non required fields, it defaults to those if no element in that form part
        const title = document.getElementById('title').value.trim();

        const description = document.getElementById('description').value.trim();

        const price = parseFloat(document.getElementById('price').value);

        const brand = document.getElementById('brand').value.trim() || 'No Brand';

        const size = document.getElementById('size').value.trim() || 'One Size';

        const condition = document.getElementById('condition').value;

        const category = document.getElementById('category').value;


        // checks that all required fields have something in them
        //check for missing images too? i think it gets a warning anyway, but double check. possible image check could be
        //selectedImages.length === 0


        if (!title || !price || !condition || !category) {
          showMsg('Please fill in all required fields.', 'error');
          submitBtn.disabled = false; return;
        }
        if (price <= 0) {
          showMsg('Price must be greater than 0.', 'error');
          submitBtn.disabled = false; return;
        }

        // uploading images to supabase, gets their urls and stores to be put into the item table so can be referenced from bucket
        let imageUrls = [];
        if (selectedImages.length > 0) {
        for (let i = 0; i < selectedImages.length; i++) {


            const file = selectedImages[i];
            const fileExt = file.name.split('.').pop();
             const fileName = `${user.id}_${Date.now()}_${i}.${fileExt}`;

            const { data, error } = await window.supabase.storage
              .from('itemPictures')
              .upload(fileName, file);

            if (error) {
            console.error('Error uploading image:', error);

              showMsg('Error uploading images. Please try again.', 'error');

              submitBtn.disabled = false;
              return;}

            const { data: { publicUrl } } = window.supabase.storage
                .from('itemPictures')
                .getPublicUrl(fileName);

              //so images can be referenced
            imageUrls.push(publicUrl);
          }
        }

        // creates record of item data in items table
          const itemData = {
            seller_id: user.id,
            title,
            description: description || null,
            price,
            brand: brand || 'No Brand',
            size: size || 'One Size',
            condition,
            category,
            is_sold: false
          };

        //debug

        console.log('item being inserted information:', itemData);
//

        //inserts or updates the item record in the items table
        const { data: itemResult, error: itemError } = isEditMode
          ? await window.supabase
              .from('items')
              .update(itemData)
              .eq('id', editItemId)
              .select()
              .single()
          : await window.supabase
              .from('items')
              .insert([itemData])
              .select()
              .single();

          if (itemError) {
            console.error('Error saving listing:', itemError);
            showMsg('Error saving listing: ' + itemError.message, 'error');
            submitBtn.disabled = false;
            return;
          }

        //gets the id of the item that was just created or updated, allows reference in other tables and to display to page etc
        const itemId = itemResult.id;
        console.log('Listing saved with ID:', itemId);

        // inserts images into table based on links from the itemImages bucket and puts item id 
        if (imageUrls.length > 0) {
          const imageRecords = imageUrls.map((url, index) => ({
          item_id: itemId,
            image_url: url,
            //here's how the order is saved in the table, so if adding custom ordering, would reference this to save that order that was created.
            display_order: index
          }));

          console.log('images inserted:', imageRecords);

          const { error: imagesError } = await window.supabase
            .from('item_images')
            .insert(imageRecords);

          if (imagesError) {

            console.error('Error inserting images:', imagesError);
            showMsg(isEditMode ? 'Listing updated but there was an error saving new images. ' + imagesError.message : 'Item created but error saving images. ' + imagesError.message, 'error');
            submitBtn.disabled = false;

            return;
          }
        }

        console.log('Listing created successfully!');
        showMsg(isEditMode ? 'Listing updated successfully! Redirecting...' : 'Listing created successfully! Redirecting...', 'success');
        //leaves page after a readble amount of time back to main page, which is refreshed and will likely show listing that was just created
        setTimeout(() => window.location.href = isEditMode ? `product.html?id=${itemId}` : 'index.html', 2000);

      } catch (error) {
        console.error('Error:', error);
        showMsg('An unexpected error occurred. Please try again.', 'error');
        submitBtn.disabled = false;
      }
    });

      function showMsg(text, type = 'error') {

        msgEl.textContent = text;

        msgEl.className = `msg ${type}`;
        msgEl.style.display = 'block';
        //}
      }

    // checks that the session user is authenticated, should be referenced before allowing users to create listing
    document.addEventListener('DOMContentLoaded', async () => {

      const session = await requireAuth();
      const user = session?.user;


      console.log('page is logged in on user: ', user);
      
      if (!user) {
        showMsg('You must be logged in to create a listing. Redirecting to login...', 'error');
        setTimeout(() => window.location.href = 'login.html', 2000);
        return;
      }

      if (isEditMode) {
        document.querySelector('h1').textContent = 'Edit Listing';
        submitBtn.textContent = 'Save changes';
        await loadItemForEdit(editItemId, user);
      }
    });

    async function loadItemForEdit(itemId, user) {
      const { data: item, error } = await window.supabase
        .from('items')
        .select('id, seller_id, title, description, price, brand, size, condition, category, is_sold')
        .eq('id', itemId)
        .single();

      if (error || !item) {
        showMsg('Listing not found.', 'error');
        setTimeout(() => window.location.href = 'index.html', 2000);
        return;
      }

      if (!user || item.seller_id !== user.id) {
        showMsg('You can only edit your own listing.', 'error');
        setTimeout(() => window.location.href = 'index.html', 2000);
        return;
      }

      editItem = item;
      document.getElementById('title').value = item.title;
      document.getElementById('description').value = item.description || '';
      document.getElementById('price').value = item.price;
      document.getElementById('brand').value = item.brand || 'No Brand';
      document.getElementById('size').value = item.size || 'One Size';
      document.getElementById('condition').value = item.condition;
      document.getElementById('category').value = item.category;
    }
  </script>
</body>
</html>
