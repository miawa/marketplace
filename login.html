<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Marketplace</title>
    <style>
        :root {
            --primary-blue: #00767d;
            --bg-gray: #f4f7f6;
            --text-dark: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .loginClass {
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }


        .inputGroup {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .forgotPassword {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--primary-blue);
            text-decoration: none;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .btnLogin {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;

            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btnLogin:hover { opacity: 0.9; }
          .btnLogin:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider {
            margin: 25px 0;
            display: flex;
            align-items: center;
            color: #999;
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
            margin: 0 10px;
        }



        .footer-text {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #666;
        }

        .footer-text a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

       
        .msg {
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .msg.error   { background: #fef2f2; color: #b91c1c; display: block; }
        .msg.success { background: #f0fdf4; color: #15803d; display: block; }
    </style>
</head>
<body>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<div class="loginClass">
    <div class="title">MARKETPLACE</div>

    <div id="msg" class="msg"></div>

    <form id="loginForm">
        <div class="inputGroup">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="e.g. name@uni.ac.uk" required>
        </div>

        <div class="inputGroup">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <a href="#" class="forgotPassword" id="forgotLink">Forgot password?</a>

        <button type="submit" class="btnLogin" id="loginBtn">Login</button>
    </form>

    <div class="divider">OR</div>


    <p class="footer-text">
  Don't have an account? <a href="signup.html">Sign up</a>
    </p>
</div>

<script>
  const msgEl  = document.getElementById("msg");
  const btnEl  = document.getElementById("loginBtn");

  //helper function for error and success messages 
  function showMsg(text, type = "error") {
    msgEl.textContent = text;
    msgEl.className   = "msg " + type;
  }

  //email and password login. could change to username also logs person in? 
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    btnEl.disabled    = true;
    btnEl.textContent = "Logging in…";

    try {
      await logIn( document.getElementById("email").value, document.getElementById("password").value);
      window.location.href = "index.html";
    } catch (err) {
      showMsg(err.message);
      btnEl.disabled    = false;
      btnEl.textContent = "Login";
    }
  });


  // forgot password
  document.getElementById("forgotLink").addEventListener("click", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            if (!email) { showMsg("Please enter your email"); return; }

            //supabase has own forgot password / reset system we can use unless opt for custom one
            const { error } = await window.supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/index.html"
                });

        if (error) { showMsg(error.message); 

        }else        { 
            showMsg("Password reset email sent."); 
        }
  });


  //if user already logged into session, continues as logged in user by redirecting to main page.
  (async () => {
    const session = await getSession();
    if (session) window.location.href = "index.html";
  })();
</script>

</body>
</html>
