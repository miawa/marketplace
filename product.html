<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <link rel="stylesheet" href="css/product-style.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/top-menu.css">
</head>
<body>
  <div class="content-wrapper">

    <!-- Top Menu Bar HTML -->
        <div class="top-menu">
          
            <div class="logo">
              <img class="site-logo" src="images/logo-notext.png" alt="Minted Site Logo" class="top-logo" />
              <img class="site-logo-text" src="images/logo-text-only.png" alt="Minted Site Logo" class="top-logo" />
            </div>
          
          
          <div class="profile-options">
            <img src="images/default.png" alt="Profile" class="top-avatar" onclick="window.location.href='profile.html?'" />
            <img src="images/messages.png" alt="Messages" id="messageBtn" onclick="window.location.href='messages.html'" />
            <img src="images/logout.png" alt="Logout" id="logoutBtn" />          
          </div>
          
          <div class="categories">
              <div class="menu-img">
                <a href="index.html?category=All Items"><img class="menu-img" src="images/all.png" alt="All Items"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Clothing"><img class="menu-img" src="images/clothing.png" alt="Clothing"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Electronics"><img class="menu-img" src="images/electronics.png" alt="Electronics"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Furniture"><img class="menu-img" src="images/furniture.png" alt="Furniture"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Textbooks"><img class="menu-img" src="images/textbook.png" alt="Textbooks"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Other"><img class="menu-img" src="images/other.png" alt="Other"></a>
              </div>
          </div>
        </div>
        <!-- End Top Menu Bar HTML -->

    <main class="main-content" id="productDetail">
      <!-- <div class="content-wrapper" id="productDetail">

      </div> -->
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/global.js"></script>
  <script src="js/product.js"></script>

  
  <div id="offerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:32px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.15); margin:20px;">
      <h2 style="font-size:20px; font-weight:700; color:#111; margin-bottom:6px;">Make an Offer</h2>
      <div id="offerItemTitle" style="font-size:13px; color:#7032a0; margin-bottom:24px;"></div>
      <div style="position:relative; margin-bottom:20px;">
        <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:18px; font-weight:600; color:#7032a0;">£</span>
        <input type="number" id="offerAmount" placeholder="0.00" min="0.01" step="0.01"
          style="width:100%; padding:14px 14px 14px 32px; font-size:22px; font-weight:600; border:2px solid #7032a0; border-radius:10px; outline:none; box-sizing:border-box; font-family:inherit;"
          onfocus="this.style.borderColor='#7032a0'" onblur="this.style.borderColor='#e5e7eb'">
      </div>
      <div style="display:flex; gap:10px;">
        <button onclick="closeOfferModal()" style="flex:1; padding:12px; border:1px solid #e5e7eb; background:#fff; border-radius:8px; font-size:15px; cursor:pointer; font-weight:500; color:#374151;">Cancel</button>
        <button id="offerSubmitBtn" onclick="submitOffer()" style="flex:2; padding:12px; background:#7032a0; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">Send Offer</button>
      </div>
    </div>
  </div>

  <script>
    //display bits
    document.getElementById('offerModal').style.display = 'none';
    const _origHandleOffer = window.handleOffer;
    window.handleOffer = function(...args) {
        document.getElementById('offerModal').style.display = 'flex';
        _origHandleOffer(...args);
    };
    window.closeOfferModal = function() {

      document.getElementById('offerModal').style.display = 'none';

      document.getElementById('offerSubmitBtn').disabled = false;
      document.getElementById('offerSubmitBtn').textContent = 'Send Offer';
    };
  </script>
</body>
</html>
