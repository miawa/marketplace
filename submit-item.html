<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Submit Item | Minted</title>

        <!-- CSS Includes -->
        <link rel="stylesheet" href="css/submit-item.css" />
    </head>
    <body>
    
    <!-- Main Item Submit Form -->
    <div class="formBox">
        <div class="brand-logo">SUBMIT ITEM</div>

        <div id="msg" class="msg"></div>

        <form id="itemForm">

            <!-- Item Title -->
            <div class="input-group">
                <label for="title">Title *</label>
                <input type="text" id="title" placeholder="e.g. Computer Science Textbook" required>
            </div>

            <!-- Item Description -->
            <div class="input-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Describe the item..."></textarea>
            </div>

            <!-- Item Price -->
            <div class="input-group">
                <label for="price">Price (£) *</label>
                <input type="number" id="price" step="0.01" min="0.01" placeholder="0.00" required>

            <!-- Item Brand -->
            <div class="input-group">
                <label for="brand">Brand</label>
                <input type="text" id="brand" placeholder="e.g. Apple" value="No Brand">
            </div>

            <!-- Item Size -->
            <div class="input-group">
                <label for="size">Size</label>
                <input type="text" id="size" placeholder="e.g. M, 10, one size" value="One Size">
            </div>

            <!-- Item Condition Dropdown -->
            <div class="input-group">
                <label for="condition">Condition *</label>
                <select id="condition" required>
                    <option value="">Select condition</option>
                    <option value="new">New</option>
                    <option value="likeNew">Like New</option>
                    <option value="good">Good</option>
                    <option value="fair">Fair</option>
                    <option value="poor">Poor</option>
                </select>
            </div>

            <!-- Item Category Dropdown -->
            <div class="input-group">
                <label for="category">Category *</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="clothing">Clothing</option>
                    <option value="shoes">Shoes</option>
                    <option value="accessories">Accessories</option>
                    <option value="electronics">Electronics</option>
                    <option value="books">Books</option>
                    <option value="home">Home & Garden</option>
                    <option value="sports">Sports</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Submit Item Button -->
            <button type="submit" class="btn-submit" id="submitBtn">Submit Item</button>
        </form>
    </div>
    <!-- End Main Item Submit Form -->

    <!-- Javascript Includes -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/global.js"></script>
    <script src="js/submit-item.js"></script>
    <!-- End Javascript Includes -->

    </body>
</html>
