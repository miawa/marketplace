<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marketplace</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/top-menu.css" />
</head>
<body>

  <div class="layout">

      <main class="content-wrapper">

        <!-- Top Menu Bar HTML -->
        <div class="top-menu">
          
            <div class="logo">
              <img class="site-logo" src="images/logo-notext.png" alt="Minted Site Logo" class="top-logo" />
              <img class="site-logo-text" src="images/logo-text-only.png" alt="Minted Site Logo" class="top-logo" />
            </div>
          
          
          <div class="profile-options">
            <img src="https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg" alt="Profile" class="top-avatar" onclick="window.location.href='profile.html?'" />
            <button id="messageBtn" onclick="window.location.href='messages.html'">Messages</button>
            <button id="logoutBtn">Log out</button>           
          </div>
          
          <div class="categories">
              <div class="menu-img">
                <a href="index.html?category=All Items"><img class="menu-img" src="images/all.png" alt="All Items"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Clothing"><img class="menu-img" src="images/clothing.png" alt="Clothing"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Electronics"><img class="menu-img" src="images/electronics.png" alt="Electronics"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Furniture"><img class="menu-img" src="images/furniture.png" alt="Furniture"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Textbooks"><img class="menu-img" src="images/textbook.png" alt="Textbooks"></a>
              </div>
              <div class="menu-img">
                <a href="index.html?category=Other"><img class="menu-img" src="images/other.png" alt="Other"></a>
              </div>
          </div>
        </div>
        <!-- End Top Menu Bar HTML -->

        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Search for items..." />
        </div>
        

        <div id="productGrid" class="product-grid"></div>

      </main>
    <!-- </main> -->

  </div>

 
  <button id="createListingBtn" class="floating-btn" title="Create Listing">
    <span>+</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/global.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
