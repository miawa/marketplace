<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marketplace</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/top-menu.css" />
</head>
<body>

  <div class="layout">

      <main class="content-wrapper">

        <!-- Top Menu Bar HTML -->
        <div class="top-menu">
          
            <div class="logo">
              <img class="site-logo" src="images/logo-notext.png" alt="Minted Site Logo" class="top-logo" />
              <img class="site-logo-text" src="images/logo-text-only.png" alt="Minted Site Logo" class="top-logo" />
            </div>
          
          <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for items..." />
          </div>
          <div class="profile-options">
            <img src="https://rmawimcxlvvmhuznzsnt.supabase.co/storage/v1/object/public/profilePictures/default-avatar.jpg" alt="Profile" class="top-avatar" onclick="window.location.href='profile.html?'" />
            <button id="messageBtn" onclick="window.location.href='messages.html'">Messages</button>
            <button id="logoutBtn">Log out</button>           
          </div> 
        </div>
        <!-- End Top Menu Bar HTML -->

        <h2 class="header-general">Categories</h2>
        <div class="categories">
          <ul>            
            <li class="active">
              <div class="menu-img">
                <img class="menu-img" src="images/all.png" alt="All Items" onclick="loadProductsToPage('','All Items');">
                <span class="menu-text">All Items</span>
              </div>
            </li>
            <li>
              <div class="menu-img"><img src="images/textbook.png" alt="Textbooks" onclick="loadProductsToPage('','Textbooks');">
              <span class="menu-text">Textbooks</span></div>
            </li>
            <li>
              <div class="menu-img"><img src="images/electronics.png" alt="Electronics" onclick="loadProductsToPage('','Electronics');">
              <span class="menu-text">Electronics</span></div>
            </li>
            <li>
              <div class="menu-img"><img src="images/clothing.png" alt="Clothing" onclick="loadProductsToPage('','Clothing');">
              <span class="menu-text">Clothing</span></div>
            </li>
            <li>
              <div class="menu-img"><img src="images/furniture.png" alt="Furniture" onclick="loadProductsToPage('','Furniture');">
              <span class="menu-text">Furniture</span></div>
            </li>
            <li>
              <div class="menu-img"><img src="images/other.png" alt="Other" onclick="loadProductsToPage('','Other');">
              <span class="menu-text">Other</span></div>
            </li>
          </ul>
        </div>

        <div id="productGrid" class="product-grid"></div>

      </main>
    <!-- </main> -->

  </div>

 
  <button id="createListingBtn" class="floating-btn" title="Create Listing">
    <span>+</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/global.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
